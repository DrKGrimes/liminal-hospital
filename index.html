<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminal Hospital</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#eef1f2;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* vignette */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(20,26,28,0.38) 100%); }

  /* crosshair */
  #crosshair { position:fixed; left:50%; top:50%; width:4px; height:4px; margin:-2px 0 0 -2px;
    border-radius:50%; background:rgba(40,50,52,0.55); z-index:6; pointer-events:none;
    transition: transform .12s ease, background .12s ease; }
  #crosshair.active { transform: scale(2.2); background: rgba(40,50,52,0.9); }

  /* interaction prompt */
  #prompt { position:fixed; left:50%; top:56%; transform:translateX(-50%); z-index:6;
    color:#2c3537; font-size:14px; letter-spacing:0.12em; text-transform:uppercase;
    background:rgba(238,241,242,0.82); padding:6px 14px; border-radius:2px;
    pointer-events:none; opacity:0; transition:opacity .15s; }
  #prompt.show { opacity:1; }

  /* captions */
  #caption { position:fixed; left:50%; bottom:11%; transform:translateX(-50%); z-index:6;
    color:#39464a; font-size:15px; letter-spacing:0.06em; text-align:center; max-width:70%;
    pointer-events:none; opacity:0; transition:opacity 1.1s ease; font-style:italic; }
  #caption.show { opacity:1; }

  /* inventory */
  #inv { position:fixed; left:18px; bottom:16px; z-index:6; display:flex; gap:8px; align-items:flex-end;
    pointer-events:none; }
  .chip { width:30px; height:20px; border-radius:3px; border:1px solid rgba(30,40,42,0.35);
    box-shadow:0 1px 2px rgba(0,0,0,0.15); position:relative; }
  .chip::after { content:""; position:absolute; left:4px; top:4px; width:7px; height:7px;
    border-radius:50%; background:rgba(255,255,255,0.65); }
  #relics { color:#39464a; font-size:12px; letter-spacing:0.18em; padding-bottom:2px;
    text-transform:uppercase; }

  /* zone indicator */
  #zone { position:fixed; right:18px; bottom:16px; z-index:6; color:#5a686c; font-size:12px;
    letter-spacing:0.22em; text-transform:uppercase; pointer-events:none; }

  /* title / pause overlay */
  #overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(238,241,242,0.96);
    transition:opacity .8s ease; cursor:pointer; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 { font-weight:200; font-size:42px; letter-spacing:0.45em; color:#39464a;
    margin:0 0 8px 0; text-transform:uppercase; text-indent:0.45em; }
  #overlay .sub { color:#7d8a8e; font-size:13px; letter-spacing:0.28em; text-transform:uppercase;
    margin-bottom:42px; }
  #overlay .start { color:#39464a; font-size:14px; letter-spacing:0.22em; text-transform:uppercase;
    border:1px solid #9fb0b4; padding:12px 30px; border-radius:2px; }
  #overlay .keys { color:#8d999d; font-size:12px; letter-spacing:0.12em; margin-top:34px; line-height:2; text-align:center; }
  #overlay .seed { position:absolute; bottom:14px; color:#aab6b9; font-size:11px; letter-spacing:0.18em; }

  #fader { position:fixed; inset:0; z-index:15; background:#eef1f2; pointer-events:none;
    opacity:1; transition:opacity 2.5s ease; }
  #fader.clear { opacity:0; }

  #photoflash { position:fixed; inset:0; z-index:14; background:#fff; pointer-events:none; opacity:0; }
  #photoflash.snap { animation: snapflash 0.45s ease-out; }
  @keyframes snapflash { 0% { opacity:0.85; } 100% { opacity:0; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="crosshair"></div>
<div id="prompt"></div>
<div id="caption"></div>
<div id="inv"><span id="relics"></span></div>
<div id="zone"></div>
<div id="fader"></div>
<div id="photoflash"></div>
<div id="overlay">
  <h1>Liminal Hospital</h1>
  <div class="sub">a walking simulator</div>
  <div class="start">click to enter</div>
  <div class="keys">
    WASD — walk &nbsp;·&nbsp; mouse — look &nbsp;·&nbsp; shift — hurry &nbsp;·&nbsp; E — take<br>
    P — photograph &nbsp;·&nbsp; esc — pause
  </div>
  <div class="seed" id="seedlabel"></div>
</div>
<script type="importmap">
{ "imports": { "three": "./libs/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
